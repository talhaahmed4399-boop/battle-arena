<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Battle Arena</title>

<link rel="stylesheet" href="style.css">


</head>

<body>

<main class="auth-page">

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <section class="auth-container">

        <div class="brand">

            <div class="brand-symbol">
                BA
            </div>

            <h1>
                BATTLE <span>ARENA</span>
            </h1>

            <p>
                ENTER THE COMPETITIVE ARENA
            </p>

        </div>


        <div class="auth-card">

            <div class="auth-tabs">

                <button
                    type="button"
                    id="loginTab"
                    class="tab active"
                >
                    LOGIN
                </button>

                <button
                    type="button"
                    id="registerTab"
                    class="tab"
                >
                    REGISTER
                </button>

            </div>


            <!-- LOGIN -->

            <form id="loginForm" class="auth-form">

                <div class="form-heading">

                    <span class="eyebrow">
                        BATTLE ARENA ACCOUNT
                    </span>

                    <h2>
                        Welcome Back
                    </h2>

                    <p>
                        Login to continue.
                    </p>

                </div>


                <div class="field">

                    <label for="loginEmail">
                        EMAIL ADDRESS
                    </label>

                    <input
                        id="loginEmail"
                        type="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="field">

                    <label for="loginPassword">
                        PASSWORD
                    </label>

                    <input
                        id="loginPassword"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div class="form-extra">

                    <button
                        type="button"
                        id="forgotPassword"
                        class="text-button"
                    >
                        Forgot password?
                    </button>

                </div>


                <button
                    type="submit"
                    class="submit-button"
                    id="loginButton"
                >
                    LOGIN
                    <span>?</span>
                </button>

            </form>


            <!-- REGISTER -->

            <form
                id="registerForm"
                class="auth-form hidden"
            >

                <div class="form-heading">

                    <span class="eyebrow">
                        CREATE YOUR ACCOUNT
                    </span>

                    <h2>
                        Join Battle Arena
                    </h2>

                    <p>
                        Create your account to enter the arena.
                    </p>

                </div>


                <div class="field">

                    <label for="registerUsername">
                        USERNAME
                    </label>

                    <input
                        id="registerUsername"
                        type="text"
                        placeholder="Choose a username"
                        autocomplete="username"
                        minlength="3"
                        required
                    >

                </div>


                <div class="field">

                    <label for="registerEmail">
                        EMAIL ADDRESS
                    </label>

                    <input
                        id="registerEmail"
                        type="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="field">

                    <label for="registerPassword">
                        PASSWORD
                    </label>

                    <input
                        id="registerPassword"
                        type="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="field">

                    <label for="registerConfirm">
                        CONFIRM PASSWORD
                    </label>

                    <input
                        id="registerConfirm"
                        type="password"
                        placeholder="Repeat your password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="submit-button"
                    id="registerButton"
                >
                    CREATE ACCOUNT
                    <span>?</span>
                </button>

            </form>


            <div
                id="message"
                class="message"
                aria-live="polite"
            ></div>

        </div>


        <div class="footer-text">
            BATTLE ARENA
        </div>

    </section>

</main>


<script type="module" src="app.js"></script>


</body>
</html>
